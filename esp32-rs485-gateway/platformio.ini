[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_upload.flash_size = 16MB
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
lib_deps =
  4-20ma/ModbusMaster@^2.0.1
  256dpi/MQTT@^2.5.2
  bblanchon/ArduinoJson@^7.4.2
build_flags =
  -D ARDUINO_USB_CDC_ON_BOOT=1

[env:cams-01]
build_flags =
  ${env.build_flags}
  -D CAMS_MACHINE_ID=\"CAMS-01\"
  -D CAMS_MQTT_CLIENT_ID=\"cams-esp32-001\"
  -D CAMS_MQTT_USERNAME=MQTT_USERNAME_CAMS_01
  -D CAMS_MQTT_PASSWORD=MQTT_PASSWORD_CAMS_01

[env:cams-02]
build_flags =
  ${env.build_flags}
  -D CAMS_MACHINE_ID=\"CAMS-02\"
  -D CAMS_MQTT_CLIENT_ID=\"cams-esp32-002\"
  -D CAMS_MQTT_USERNAME=MQTT_USERNAME_CAMS_02
  -D CAMS_MQTT_PASSWORD=MQTT_PASSWORD_CAMS_02

[env:cams-03]
build_flags =
  ${env.build_flags}
  -D CAMS_MACHINE_ID=\"CAMS-03\"
  -D CAMS_MQTT_CLIENT_ID=\"cams-esp32-003\"
  -D CAMS_MQTT_USERNAME=MQTT_USERNAME_CAMS_03
  -D CAMS_MQTT_PASSWORD=MQTT_PASSWORD_CAMS_03
