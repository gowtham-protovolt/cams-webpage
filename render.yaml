services:
  - type: web
    name: cams-api
    runtime: docker
    plan: free
    dockerfilePath: ./cams-api/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_ENV
        value: production
      - key: SERVE_WEB
        value: "false"
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: cams
      - key: CORS_ORIGINS
        value: https://gowtham-protovolt.github.io
      - key: COOKIE_NAME
        value: cams_session
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAME_SITE
        value: none
      - key: SESSION_HOURS
        value: "8"
      - key: REMEMBER_SESSION_DAYS
        value: "7"
      - key: PASSWORD_RESET_MINUTES
        value: "30"
      - key: PASSWORD_RESET_BASE_URL
        value: https://gowtham-protovolt.github.io/cams-webpage/
      - key: TELEMETRY_RETENTION_DAYS
        value: "7"
      - key: TELEMETRY_STALE_SECONDS
        value: "10"
      - key: PRESSURE_BAR_MIN
        value: "6.8"
      - key: PRESSURE_BAR_MAX
        value: "7.5"
      - key: FLOW_LPM_MIN
        value: "22"
      - key: FLOW_LPM_MAX
        value: "28"
      - key: SUCTION_KPA_MIN
        value: "0.6"
      - key: SUCTION_KPA_MAX
        value: "1.8"
      - key: MQTT_ENABLED
        value: "true"
      - key: MQTT_URL
        sync: false
      - key: MQTT_USERNAME
        sync: false
      - key: MQTT_PASSWORD
        sync: false
      - key: MQTT_TOPIC
        value: cams/+/+/telemetry
      - key: MQTT_STATUS_TOPIC
        value: cams/+/+/status
      - key: MQTT_CLIENT_ID
        value: cams-api-production
