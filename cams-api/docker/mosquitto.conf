# Authenticated MQTT listeners. Port 1883 is for the private Compose network only;
# do not publish it to the host. ESP32 devices connect to the TLS listener on 8883.
# Auth settings are global (apply to both listeners) - they must appear only once.
allow_anonymous false
password_file /mosquitto/secrets/passwords
acl_file /mosquitto/secrets/acl

listener 1883 0.0.0.0

listener 8883 0.0.0.0
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key

persistence true
persistence_location /mosquitto/data/
log_type warning
