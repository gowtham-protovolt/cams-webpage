services:
  mongodb:
    image: mongo:7.0.43
    container_name: CAMS-MongoDB
    restart: unless-stopped
    command: ["mongod", "--auth", "--bind_ip_all"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:?Set MONGO_INITDB_ROOT_USERNAME in cams-api/.env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:?Set MONGO_INITDB_ROOT_PASSWORD in cams-api/.env}
      MONGO_INITDB_DATABASE: ${MONGODB_DB:-cams_local}
      MONGODB_APP_USERNAME: ${MONGODB_APP_USERNAME:?Set MONGODB_APP_USERNAME in cams-api/.env}
      MONGODB_APP_PASSWORD: ${MONGODB_APP_PASSWORD:?Set MONGODB_APP_PASSWORD in cams-api/.env}
    ports:
      - "127.0.0.1:27018:27017"
    volumes:
      - cams-mongodb-data:/data/db
      - cams-mongodb-config:/data/configdb
      - ./docker/mongo-init/01-create-cams-user.sh:/docker-entrypoint-initdb.d/01-create-cams-user.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --username \"$$MONGO_INITDB_ROOT_USERNAME\" --password \"$$MONGO_INITDB_ROOT_PASSWORD\" --authenticationDatabase admin --eval \"db.adminCommand('ping').ok\""]
      interval: 10s
      timeout: 5s
      retries: 10

  mqtt-config:
    image: eclipse-mosquitto:2.0.22
    container_name: CAMS-MQTT-Config
    restart: "no"
    environment:
      MQTT_BACKEND_USERNAME: ${MQTT_USERNAME:?Set MQTT_USERNAME in cams-api/.env}
      MQTT_BACKEND_PASSWORD: ${MQTT_PASSWORD:?Set MQTT_PASSWORD in cams-api/.env}
      MQTT_DEVICE_USERNAME: ${MQTT_DEVICE_USERNAME:?Set MQTT_DEVICE_USERNAME in cams-api/.env}
      MQTT_DEVICE_PASSWORD: ${MQTT_DEVICE_PASSWORD:?Set MQTT_DEVICE_PASSWORD in cams-api/.env}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        rm -f /mosquitto/secrets/passwords /mosquitto/secrets/acl
        mosquitto_passwd -b -c /mosquitto/secrets/passwords "$$MQTT_BACKEND_USERNAME" "$$MQTT_BACKEND_PASSWORD"
        mosquitto_passwd -b /mosquitto/secrets/passwords "$$MQTT_DEVICE_USERNAME" "$$MQTT_DEVICE_PASSWORD"
        printf 'user %s\ntopic read cams/+/+/telemetry\ntopic read cams/+/+/status\n\nuser %s\ntopic write cams/plant-01/CAMS-01/telemetry\ntopic write cams/plant-01/CAMS-01/status\n' "$$MQTT_BACKEND_USERNAME" "$$MQTT_DEVICE_USERNAME" > /mosquitto/secrets/acl
        chown -R 1883:1883 /mosquitto/secrets /mosquitto/data
        chmod 0600 /mosquitto/secrets/passwords /mosquitto/secrets/acl
    volumes:
      - cams-mqtt-secrets:/mosquitto/secrets
      - cams-mqtt-data:/mosquitto/data

  mqtt:
    image: eclipse-mosquitto:2.0.22
    container_name: CAMS-Mosquitto
    restart: unless-stopped
    entrypoint: ["/usr/sbin/mosquitto", "-c", "/mosquitto/config/mosquitto.conf"]
    depends_on:
      mqtt-config:
        condition: service_completed_successfully
    ports:
      - "1884:1883"
    volumes:
      - ./docker/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - cams-mqtt-secrets:/mosquitto/secrets:ro
      - cams-mqtt-data:/mosquitto/data

  app:
    build:
      context: ..
      dockerfile: cams-api/Dockerfile
    container_name: CAMS
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
      mqtt:
        condition: service_started
    ports:
      - "3100:3000"
    environment:
      NODE_ENV: development
      PORT: 3000
      SERVE_WEB: "true"
      WEB_ROOT: /app/public
      MONGODB_URI: mongodb://${MONGODB_APP_USERNAME:?Set MONGODB_APP_USERNAME in cams-api/.env}:${MONGODB_APP_PASSWORD:?Set MONGODB_APP_PASSWORD in cams-api/.env}@mongodb:27017/${MONGODB_DB:-cams_local}?authSource=${MONGODB_DB:-cams_local}
      MONGODB_DB: ${MONGODB_DB:-cams_local}
      CORS_ORIGINS: http://localhost:3100,http://127.0.0.1:3100
      COOKIE_NAME: cams_session
      COOKIE_SECURE: "false"
      COOKIE_SAME_SITE: lax
      SESSION_HOURS: 8
      REMEMBER_SESSION_DAYS: 7
      TELEMETRY_RETENTION_DAYS: 7
      MQTT_ENABLED: "true"
      MQTT_URL: mqtt://mqtt:1883
      MQTT_USERNAME: ${MQTT_USERNAME:?Set MQTT_USERNAME in cams-api/.env}
      MQTT_PASSWORD: ${MQTT_PASSWORD:?Set MQTT_PASSWORD in cams-api/.env}
      MQTT_TOPIC: cams/+/+/telemetry
      MQTT_CLIENT_ID: cams-api-docker

volumes:
  cams-mongodb-data:
  cams-mongodb-config:
  cams-mqtt-secrets:
  cams-mqtt-data:
