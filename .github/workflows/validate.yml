name: Validate CAMS webpage

on:
  pull_request:
  push:
    branches:
      - main
      - "feature/**"
      - "fix/**"

permissions:
  contents: read

jobs:
  ui-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cams-webpage
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate static UI
        run: npm test

  api-test:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7.0.43
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: cams-api
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: cams-api/package-lock.json

      - name: Install API dependencies
        run: npm ci

      - name: Test API security utilities
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017
          MONGODB_DB: cams_ci
          CORS_ORIGINS: http://localhost:8080
          COOKIE_SECURE: "false"
          COOKIE_SAME_SITE: lax
        run: npm test

      - name: Build production container
        working-directory: ${{ github.workspace }}
        run: docker build -f cams-api/Dockerfile -t cams-webpage:ci .

      - name: Validate load-balanced Compose configuration
        working-directory: ${{ github.workspace }}/cams-api
        env:
          MONGO_INITDB_ROOT_USERNAME: ci-root
          MONGO_INITDB_ROOT_PASSWORD: ci-root-password
          MONGODB_APP_USERNAME: ci-app
          MONGODB_APP_PASSWORD: ci-app-password
          MQTT_USERNAME: ci-mqtt
          MQTT_PASSWORD: ci-mqtt-password
        run: docker compose config --quiet

      - name: Validate Nginx configuration
        working-directory: ${{ github.workspace }}/cams-api
        run: >-
          docker run --rm
          --add-host api-1:127.0.0.1
          --add-host api-2:127.0.0.1
          --add-host api-3:127.0.0.1
          --add-host api-4:127.0.0.1
          -v "$PWD/docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro"
          nginx:1.27-alpine nginx -t
